[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrun"
version = "0.1.0.dev0"
description = "Event-sourced Agent task execution engine (learning project)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
agentrun = "agentrun.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

# 第 1B 轮起逐步收紧：先覆盖 src，tests 暂不检查。
# 不做全局 ignore，第三方缺类型时用局部注释说明原因。
[tool.mypy]
python_version = "3.14"
files = ["src/agentrun"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
